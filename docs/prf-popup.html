  <div class="title" id="title">CipherSheet Passkey</div>
  <div class="status" id="status">Connecting...</div>
</div>
<script>
  // Refuse to run if not served at the root path — guards against misconfigured
  // deployments where headers (frame-ancestors, CSP) may be absent.
  if (location.pathname !== '/') {
    document.body.innerHTML = '';
    throw new Error('prf-popup must be served at the root path');
  }

  const params = new URLSearchParams(location.search);
  const action = params.get('action') || '';
  const channel = params.get('channel') || '';
  const returnOrigin = params.get('returnOrigin') || '';
  const PRF_EVAL = new TextEncoder().encode('CipherSheet unlock key v1');

  let replyWindow = null;
  let replyOrigin = '';
  let started = false;

  console.log('[prf-popup] loaded. action:', action, 'origin:', location.origin, 'opener:', window.opener);

  function ui(title, status, _icon, isErr) {
    if (title) document.getElementById('title').textContent = title;
    if (status) document.getElementById('status').textContent = status;
    document.getElementById('status').classList.toggle('err', !!isErr);
  }

  // This popup only ever talks back to the CipherSheet add-on's Apps Script
  // origin. Pinning to an allowlist (instead of trusting any https returnOrigin)
  // stops a malicious site from opening the popup and using it as a PRF oracle.
  const ALLOWED_RETURN_ORIGINS = [
    'https://n-ffe6ohuksps7ptkjodp4qjbggyzlz2jendekrhq-0lu-script.googleusercontent.com',
  ];

  function isValidReturnOrigin(origin) {
    return ALLOWED_RETURN_ORIGINS.includes(origin);
  }

  function send(msg) {
    const target = replyWindow || window.opener;
    const origin = replyOrigin || (isValidReturnOrigin(returnOrigin) ? returnOrigin : '');
    if (!target || !origin) return;
    target.postMessage({ ...msg, channel }, origin);
  }

  if (window.opener && isValidReturnOrigin(returnOrigin)) {
    window.opener.postMessage({ type: 'prf-ready', channel }, returnOrigin);
  }

  window.addEventListener('message', async evt => {
    console.log('[prf-popup] got message:', evt.data?.type);
    if (evt.data?.type !== 'prf-start') return;
    if (evt.data?.channel !== channel) return;
    if (!isValidReturnOrigin(returnOrigin) || evt.origin !== returnOrigin) {
      console.warn('[prf-popup] rejected returnOrigin/sender:', returnOrigin, evt.origin);
      return;
    }
    if (started) return;
    started = true;
    replyWindow = evt.source;
    replyOrigin = evt.origin;

    const { challenge, evalInput, credentialId, userHandle, userName } = evt.data;
    const challengeBuf = new Uint8Array(challenge).buffer;
    const evalBuf = new Uint8Array(evalInput || Array.from(PRF_EVAL)).buffer;

    try {
      if (action === 'prf-enroll') {
        ui('Register passkey', 'Follow the prompt from your browser or device...', null, false);

        const cred = await navigator.credentials.create({ publicKey: {
          challenge: challengeBuf,
          rp: { id: location.hostname, name: 'CipherSheet' },
          user: {
            id: new Uint8Array(userHandle || [0]).buffer,
            name: userName || 'user',
            displayName: 'CipherSheet'
          },
          pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
          authenticatorSelection: { userVerification: 'required' },
          extensions: { prf: { eval: { first: evalBuf } } }
        }});

        const ext = cred.getClientExtensionResults();
        const prfFirst = ext?.prf?.results?.first;

        if (prfFirst) {
          send({
            type: 'prf-result',
            credentialId: Array.from(new Uint8Array(cred.rawId)),
            prfOutput: Array.from(new Uint8Array(prfFirst))
          });
          ui(null, 'Done!', 'OK', false);
          setTimeout(() => window.close(), 800);
          return;
        }

        if (!ext?.prf?.enabled) {
          throw new Error('This authenticator does not support PRF. Use your password instead.');
        }

        ui(null, 'Almost there - one more prompt...', null, false);
        const getCred = await navigator.credentials.get({ publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)).buffer,
          rpId: location.hostname,
          allowCredentials: [{ type: 'public-key', id: cred.rawId }],
          userVerification: 'required',
          extensions: { prf: { eval: { first: evalBuf } } }
        }});
        const getFirst = getCred.getClientExtensionResults()?.prf?.results?.first;
        if (!getFirst) throw new Error('PRF output unavailable on this authenticator.');

        send({
          type: 'prf-result',
          credentialId: Array.from(new Uint8Array(cred.rawId)),
          prfOutput: Array.from(new Uint8Array(getFirst))
        });
        ui(null, 'Done!', 'OK', false);
        setTimeout(() => window.close(), 800);

      } else if (action === 'prf-get') {
        ui('Unlock with passkey', 'Follow the prompt from your browser or device...', null, false);

        const cred = await navigator.credentials.get({ publicKey: {
          challenge: challengeBuf,
          rpId: location.hostname,
          allowCredentials: [{ type: 'public-key', id: new Uint8Array(credentialId).buffer }],
          userVerification: 'required',
          extensions: { prf: { eval: { first: evalBuf } } }
        }});
        const prfFirst = cred.getClientExtensionResults()?.prf?.results?.first;
        if (!prfFirst) throw new Error('No PRF output - authenticator may not support PRF.');

        send({ type: 'prf-result', prfOutput: Array.from(new Uint8Array(prfFirst)) });
        ui(null, 'Done!', 'OK', false);
        setTimeout(() => window.close(), 800);

      } else {
        throw new Error('Unknown action: ' + action);
      }
    } catch (e) {
      ui(null, e.message, 'X', true);
      send({ type: 'prf-error', message: e.message });
      setTimeout(() => window.close(), 4000);
    }
  });
</script>
